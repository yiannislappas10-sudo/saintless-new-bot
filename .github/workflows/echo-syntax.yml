name: ECHO syntax checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check browser modules
        run: |
          for file in features.js classroom.js; do
            node --check --input-type=module < "$file"
          done
      - name: Check Cloudflare Pages Functions
        run: |
          find functions -type f -name '*.js' -print0 |
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check --input-type=module < "$file"
          done
